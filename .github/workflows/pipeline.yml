name: ML Pipeline for Engine Maintenance Prediction

on:
  push:
    branches: [ main ]

jobs:
    train-and-deploy:
        runs-on: ubuntu-latest

        env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
            HF_REPO_DATA: ${{ vars.HF_REPO_DATA }}
            HF_REPO_MODEL: ${{ vars.HF_REPO_MODEL }}
            MODEL_FILENAME: ${{ vars.MODEL_FILENAME }}

        steps:

            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.10'

            - name: Install dependencies
              run: |
                pip install -r requirements.txt

            - name: Run model training script
              run: |
                python src/train.py

            - name: Run model evaluation script
              run: |
                python src/evaluate.py

            - name: Save model
              run: |
                echo "Model training completed"

            - name: Upload model to Hugging Face Hub              
              run: |
                python src/upload_model.py


